[package]
name = "saarathi-desktop"
version = "0.1.0"
description = "Saarathi Desktop: a control layer over the Saarathi orchestration engine"
authors = ["Vaikartana"]
license = "Apache-2.0"
repository = "https://github.com/V4ikartana/saarathi"
edition = "2024"
rust-version = "1.90"

[lib]
name = "saarathi_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["sync", "time"] }
