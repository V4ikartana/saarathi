[project]
name = "saarathi"
dynamic = ["version"]
description = "Local-first orchestrator that coordinates multiple AI coding agents to turn project briefs into verified changes."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Vaikartana" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
]
dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "typer>=0.12",
    "platformdirs>=4.2",
]

[project.scripts]
saarathi = "saarathi.cli.main:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/saarathi/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/saarathi"]

[tool.hatch.build.targets.sdist]
include = [
    "src/saarathi",
    "tests",
    "docs",
    "examples",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "SECURITY.md",
    "CONTRIBUTING.md",
    "CODE_OF_CONDUCT.md",
    "pyproject.toml",
    "uv.lock",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: runs real provider CLIs and consumes quota (opt in with SAARATHI_LIVE_TESTS=1)",
]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S", "RUF"]
ignore = ["S603", "S607", "S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["saarathi"]
mypy_path = "src"
